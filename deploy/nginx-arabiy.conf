# Arabiy bot uchun nginx server bloki.
# BOT_DOMAIN ni haqiqiy subdomeningizga almashtiring (masalan bot.example.com).
# certbot keyinchalik shu faylga HTTPS (443) qismini avtomatik qo'shadi.

server {
    listen 80;
    server_name BOT_DOMAIN;

    # Audio va statik fayllar uchun yetarli
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
